name: Collect X posts

on:
  schedule:
    - cron: "17 * * * *"   # 毎時 17 分 (UTC)。トピックごとの interval_min に達したものだけ収集される
  workflow_dispatch:
    inputs:
      force:
        description: 収集間隔を無視して全トピックを今すぐ収集する
        type: boolean
        default: true
  push:
    branches: [main]
    paths: [topics.json]   # トピックを編集したら追加・削除をすぐ反映

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect
        run: python collector/collect.py ${{ inputs.force && '--force' || '' }}
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet && exit 0
          git commit -m "data: update collected posts"
          git pull --rebase
          git push
