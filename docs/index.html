<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<title>X トピックレポート</title>
<style>
:root {
  --bg: #f5f2ea; --panel: #fffdf8; --ink: #1d1b17; --sub: #6d675c; --line: #ddd6c6;
  --accent: #b83d24; --accent-soft: #f3dfd6; --ok: #2f7d4f; --err: #b3261e;
  --serif: "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", serif;
  --sans: "Hiragino Sans", "Yu Gothic UI", "Meiryo", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #16150f; --panel: #1f1d16; --ink: #ece7da; --sub: #a09a8c; --line: #38352a;
          --accent: #ef7d5f; --accent-soft: #3a2219; --ok: #6fc391; --err: #f28b82; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.7 var(--sans); }
a { color: inherit; }
button, select { font: inherit; color: inherit; }
.wrap { max-width: 1180px; margin: 0 auto; padding: 0 20px 80px; }
header.mast { border-bottom: 3px double var(--ink); padding: 26px 0 14px; display: flex; flex-wrap: wrap;
  align-items: baseline; gap: 6px 18px; }
.mast h1 { font: 700 30px/1.2 var(--serif); margin: 0; letter-spacing: .04em; }
.mast .meta { color: var(--sub); font-size: 13px; margin-left: auto; }
nav.topics { display: flex; flex-wrap: wrap; gap: 8px; padding: 14px 0; border-bottom: 1px solid var(--line); }
nav.topics button { background: none; border: 1px solid var(--line); border-radius: 999px; padding: 4px 14px;
  cursor: pointer; }
nav.topics button[aria-pressed=true] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
nav.topics button .n { color: var(--sub); font-size: 12px; margin-left: 6px; }
nav.topics button[aria-pressed=true] .n { color: inherit; opacity: .7; }
nav.topics a.manage { margin-left: auto; align-self: center; font-size: 13px; color: var(--sub); }
.head { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 10px 16px; margin: 26px 0 6px; }
.head h2 { font: 700 26px/1.3 var(--serif); margin: 0; }
.controls { margin-left: auto; display: flex; flex-wrap: wrap; gap: 8px; }
.controls select, .btn { background: var(--panel); border: 1px solid var(--line); border-radius: 6px;
  padding: 5px 10px; cursor: pointer; text-decoration: none; font-size: 13px; }
.btn:hover, .controls select:hover { border-color: var(--ink); }
.query { color: var(--sub); font-size: 13px; margin: 0 0 4px; overflow-wrap: anywhere; }
.query code { background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 1px 6px;
  font: 12px ui-monospace, Consolas, monospace; }
.status { font-size: 13px; color: var(--sub); }
.status.err { color: var(--err); }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 0;
  border: 1px solid var(--line); background: var(--panel); margin: 18px 0 8px; }
.stats div { padding: 12px 16px; border-right: 1px solid var(--line); }
.stats div:last-child { border-right: 0; }
.stats b { display: block; font: 700 26px/1.2 var(--serif); font-variant-numeric: tabular-nums; }
.stats span { color: var(--sub); font-size: 12px; }
.cols { display: grid; grid-template-columns: minmax(0, 1fr) 280px; gap: 36px; }
@media (max-width: 860px) { .cols { grid-template-columns: 1fr; } }
h3 { font: 700 18px/1.3 var(--serif); margin: 34px 0 4px; padding-bottom: 6px; border-bottom: 2px solid var(--ink);
  display: flex; align-items: baseline; gap: 10px; }
h3 small { font: 400 12px var(--sans); color: var(--sub); }
ol.articles { list-style: none; margin: 0; padding: 0; counter-reset: a; }
ol.articles > li { counter-increment: a; display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 0 8px;
  padding: 14px 0; border-bottom: 1px solid var(--line); }
ol.articles > li::before { content: counter(a); font: 700 20px/1.4 var(--serif); color: var(--accent); }
.a-title { font-weight: 700; font-size: 16px; line-height: 1.5; text-decoration: none; overflow-wrap: anywhere; }
.a-title:hover { text-decoration: underline; }
.a-meta { color: var(--sub); font-size: 12px; margin: 2px 0; }
.a-meta .badge { background: var(--accent-soft); color: var(--accent); border-radius: 3px; padding: 0 6px;
  margin-right: 6px; font-weight: 700; }
.a-excerpt { margin: 4px 0 6px; font-size: 14px; color: var(--sub); border-left: 3px solid var(--line);
  padding-left: 10px; overflow-wrap: anywhere; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips a { font-size: 12px; border: 1px solid var(--line); border-radius: 999px; padding: 0 9px;
  text-decoration: none; background: var(--panel); }
.chips a:hover { border-color: var(--accent); color: var(--accent); }
ul.posts { list-style: none; margin: 0; padding: 0; }
ul.posts li { padding: 13px 0; border-bottom: 1px solid var(--line); }
.p-head { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; font-size: 13px; }
.p-head b { font-size: 14px; }
.p-head .h, .p-head time { color: var(--sub); }
.new { background: var(--accent); color: #fff; font-size: 10px; font-weight: 700; border-radius: 3px;
  padding: 0 5px; letter-spacing: .05em; }
.p-text { margin: 4px 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.p-foot { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--sub);
  font-variant-numeric: tabular-nums; }
.p-foot a { margin-left: auto; color: var(--accent); font-weight: 700; text-decoration: none; }
.p-foot a:hover { text-decoration: underline; }
aside h3 { font-size: 15px; }
aside ul { list-style: none; margin: 0; padding: 0; font-size: 13px; }
aside li { display: flex; justify-content: space-between; gap: 8px; padding: 5px 0;
  border-bottom: 1px dotted var(--line); }
aside li span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
aside li span:last-child { color: var(--sub); white-space: nowrap; font-variant-numeric: tabular-nums; }
.empty { color: var(--sub); padding: 26px 0; }
.more { margin: 14px 0; }
footer { margin-top: 50px; padding-top: 14px; border-top: 1px solid var(--line); color: var(--sub); font-size: 12px; }
</style>
</head>
<body>
<div class="wrap">
  <header class="mast">
    <h1>X トピックレポート</h1>
    <span class="meta" id="generated"></span>
  </header>
  <nav class="topics" id="topics" aria-label="トピック"></nav>
  <main id="main"><p class="empty">読み込み中…</p></main>
  <footer>
    投稿データは <a href="https://github.com/FxEmbed/FxEmbed" rel="noopener noreferrer">FxTwitter (FxEmbed)</a>
    の公開 API から周期取得しています。本文は抜粋のみを保持し、各投稿は X 上の元投稿へリンクしています。
    投稿の著作権は各投稿者に帰属します。
  </footer>
</div>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
const PAGE = 40;
const state = { index: null, data: null, topic: null, hours: 168, sort: "score", shown: PAGE };

// GitHub Pages (owner.github.io/repo/) 上ならリポジトリの URL を導出する
const repoUrl = (() => {
  const m = location.hostname.match(/^([\w-]+)\.github\.io$/);
  const repo = location.pathname.split("/")[1];
  return m && repo ? `https://github.com/${m[1]}/${repo}` : null;
})();

function el(tag, props, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (k === "class") e.className = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (v !== null && v !== undefined && v !== false) e.setAttribute(k, v);
  }
  for (const kid of kids.flat()) if (kid !== null && kid !== undefined && kid !== false) e.append(kid);
  return e;
}
// 外部リンクは http(s) のみ許可
function link(url, props, ...kids) {
  const ok = /^https?:\/\//i.test(url || "");
  return el("a", { ...props, href: ok ? url : null, target: "_blank", rel: "noopener noreferrer" }, ...kids);
}
const num = (n) => (n || 0).toLocaleString("ja-JP");
const fmtTime = (ts) => ts ? new Date(ts * 1000).toLocaleString("ja-JP",
  { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" }) : "—";
function ago(ts) {
  if (!ts) return "未収集";
  const m = Math.max(0, Math.round((Date.now() / 1000 - ts) / 60));
  return m < 1 ? "たった今" : m < 60 ? `${m} 分前` : m < 1440 ? `${Math.round(m / 60)} 時間前` : `${Math.round(m / 1440)} 日前`;
}
const score = (p) => p.likes + p.reposts * 2 + p.quotes * 2 + p.replies;
function excerpt(text, n = 160) {
  const s = text.replace(/https?:\/\/\S+/g, "").replace(/\s+/g, " ").trim();
  return s.length <= n ? s : s.slice(0, n) + "…";
}
function hostOf(url) { try { return new URL(url).hostname.replace(/^www\./, ""); } catch { return ""; } }

async function getJSON(path) {
  const r = await fetch(`${path}?t=${Date.now()}`, { cache: "no-store" });
  if (!r.ok) throw new Error(`${path}: HTTP ${r.status}`);
  return r.json();
}

// ---- レポート集計（期間・並びはブラウザ側で切り替える） ----
function buildReport(data, hours, sort) {
  const since = hours ? Date.now() / 1000 - hours * 3600 : 0;
  const lastStart = data.runs.length ? data.runs[0].started_at : 0;
  const posts = data.posts.filter((p) => p.ts >= since)
    .map((p) => ({ ...p, score: score(p), isNew: lastStart > 0 && p.first_seen >= lastStart }));
  const tags = new Map(), authors = new Map(), articles = new Map();
  for (const p of posts) {
    for (const t of p.hashtags) tags.set(t, (tags.get(t) || 0) + 1);
    const a = authors.get(p.handle) || { handle: p.handle, name: p.name, posts: 0, likes: 0 };
    a.posts++; a.likes += p.likes; authors.set(p.handle, a);
    const refs = p.links.map((u) => [u, data.titles[u] || "", "link"]);
    if (p.article_title) refs.push([p.url, p.article_title, "x_article"]);
    for (const [url, title, kind] of refs) {
      const art = articles.get(url) || { url, title, kind, likes: 0, score: 0, posts: [] };
      art.likes += p.likes; art.score += p.score; art.posts.push(p); articles.set(url, art);
    }
  }
  const artList = [...articles.values()];
  for (const a of artList) a.posts.sort((x, y) => y.score - x.score);
  artList.sort((a, b) => b.posts.length - a.posts.length || b.score - a.score);
  posts.sort(sort === "new" ? (a, b) => b.ts - a.ts : (a, b) => b.score - a.score);
  return {
    posts, articles: artList,
    hashtags: [...tags.entries()].sort((a, b) => b[1] - a[1]).slice(0, 20),
    authors: [...authors.values()].sort((a, b) => b.posts - a.posts || b.likes - a.likes).slice(0, 12),
    stats: { posts: posts.length, articles: artList.length, authors: authors.size,
             likes: posts.reduce((s, p) => s + p.likes, 0), fresh: posts.filter((p) => p.isNew).length },
  };
}

function markdown(data, rep) {
  const period = state.hours ? `直近 ${state.hours} 時間` : "全期間";
  const out = [`# ${data.topic.name} — X トピックレポート`, "",
    `- 期間: ${period} / 最終収集: ${fmtTime(data.last_run_at)}`,
    `- 投稿 ${rep.stats.posts} 件 / 記事 ${rep.stats.articles} 件 / 投稿者 ${rep.stats.authors} 人`, "",
    "## 記事まとめ", ""];
  for (const a of rep.articles) {
    out.push(`### [${a.title || a.url}](${a.url})`,
      `${hostOf(a.url)} ・ 言及 ${a.posts.length} 件 ・ いいね計 ${a.likes}`,
      `> ${excerpt(a.posts[0].text)}`,
      "投稿: " + a.posts.slice(0, 8).map((p) => `[@${p.handle}](${p.url})`).join(" / "), "");
  }
  out.push("## 投稿一覧", "");
  for (const p of rep.posts) {
    out.push(`- [@${p.handle} ${fmtTime(p.ts)}](${p.url}) ♥${p.likes} RP${p.reposts} — ${excerpt(p.text, 120)}`);
  }
  return out.join("\n") + "\n";
}

// ---- 描画 ----
function renderNav() {
  const nav = $("topics");
  nav.replaceChildren(...state.index.topics.map((t) =>
    el("button", { "aria-pressed": String(t.id === state.topic), onclick: () => selectTopic(t.id) },
      t.name, el("span", { class: "n" }, num(t.post_count)))));
  if (repoUrl) nav.append(link(`${repoUrl}/edit/main/topics.json`, { class: "manage" }, "トピックを編集 ↗"));
  $("generated").textContent = `データ更新: ${fmtTime(state.index.generated_at)}`;
}

function renderArticle(a) {
  const top = a.posts[0];
  return el("li", null, el("div", null,
    link(a.url, { class: "a-title" }, a.title || a.url),
    el("div", { class: "a-meta" },
      el("span", { class: "badge" }, `言及 ${a.posts.length}`),
      a.kind === "x_article" ? "X 記事" : hostOf(a.url), ` ・ いいね計 ${num(a.likes)}`),
    el("div", { class: "a-excerpt" }, `@${top.handle}: ${excerpt(top.text)}`),
    el("div", { class: "chips" }, a.posts.slice(0, 8).map((p) => link(p.url, null, `@${p.handle} ↗`)),
      a.posts.length > 8 && el("span", { class: "a-meta" }, `ほか ${a.posts.length - 8} 件`))));
}

function renderPost(p) {
  return el("li", null,
    el("div", { class: "p-head" },
      el("b", null, p.name), el("span", { class: "h" }, `@${p.handle}`),
      el("time", null, fmtTime(p.ts)), p.isNew && el("span", { class: "new" }, "NEW")),
    el("div", { class: "p-text" }, p.text),
    el("div", { class: "p-foot" },
      el("span", null, `♥ ${num(p.likes)}`), el("span", null, `リポスト ${num(p.reposts)}`),
      el("span", null, `返信 ${num(p.replies)}`), p.views > 0 && el("span", null, `表示 ${num(p.views)}`),
      link(p.url, null, "X で開く ↗")));
}

function sideList(title, rows) {
  return [el("h3", null, title),
    rows.length ? el("ul", null, rows.map(([a, b]) => el("li", null, el("span", null, a), el("span", null, b))))
                : el("p", { class: "empty" }, "なし")];
}

function render() {
  const main = $("main"), data = state.data;
  if (!data) return;
  const t = data.topic, rep = buildReport(data, state.hours, state.sort);
  const sel = (key, opts) => el("select", { "aria-label": key, onchange: (e) => {
      state[key] = key === "hours" ? Number(e.target.value) : e.target.value; state.shown = PAGE; saveHash(); render(); } },
    opts.map(([v, label]) => el("option", { value: v, selected: String(state[key]) === String(v) }, label)));
  const isErr = !!(data.runs[0] && data.runs[0].error);
  const sources = [t.built_query && el("span", null, "検索 ", el("code", null, t.built_query)),
    t.accounts.length > 0 && el("span", null, " 監視 ", el("code", null, t.accounts.map((a) => "@" + a).join(" ")))];

  main.replaceChildren(
    el("div", { class: "head" },
      el("h2", null, t.name),
      el("div", { class: "controls" },
        sel("hours", [[24, "直近 24 時間"], [72, "直近 3 日"], [168, "直近 7 日"], [0, "全期間"]]),
        sel("sort", [["score", "反響順"], ["new", "新着順"]]),
        el("button", { class: "btn", onclick: () => download(`x-report-${t.id}.md`, markdown(data, rep)) }, "Markdown 保存"),
        repoUrl && link(`${repoUrl}/actions/workflows/collect.yml`, { class: "btn" }, "今すぐ収集 ↗"))),
    el("p", { class: "query" }, sources),
    el("p", { class: "status" + (isErr ? " err" : "") },
      `最終収集 ${ago(data.last_run_at)}（${data.last_status || "—"}）・${t.interval_min} 分ごと` +
      (t.enabled ? "" : "・停止中")),
    el("div", { class: "stats" },
      [["投稿", rep.stats.posts], ["うち新着", rep.stats.fresh], ["記事・リンク", rep.stats.articles],
       ["投稿者", rep.stats.authors], ["いいね計", rep.stats.likes]]
        .map(([label, v]) => el("div", null, el("b", null, num(v)), el("span", null, label)))),
    el("div", { class: "cols" },
      el("section", null,
        el("h3", null, "記事まとめ", el("small", null, "投稿で言及された記事を言及数・反響順に")),
        rep.articles.length
          ? el("ol", { class: "articles" }, rep.articles.slice(0, 30).map(renderArticle))
          : el("p", { class: "empty" }, "この期間にリンク付きの投稿はありません。"),
        el("h3", null, "投稿一覧", el("small", null, `${num(rep.posts.length)} 件`)),
        rep.posts.length
          ? el("ul", { class: "posts" }, rep.posts.slice(0, state.shown).map(renderPost))
          : el("p", { class: "empty" }, "この期間の投稿はありません。期間を広げてみてください。"),
        rep.posts.length > state.shown && el("button", { class: "btn more",
          onclick: () => { state.shown += PAGE; render(); } }, `さらに表示（残り ${rep.posts.length - state.shown} 件）`)),
      el("aside", null,
        sideList("ハッシュタグ", rep.hashtags.map(([tag, n]) => ["#" + tag, `${n} 件`])),
        sideList("よく登場する投稿者", rep.authors.map((a) => [`${a.name} @${a.handle}`, `${a.posts} 件`])),
        sideList("収集履歴", data.runs.slice(0, 8).map((r) =>
          [fmtTime(r.started_at), r.error ? "エラー" : `${r.found} 件 / 新規 ${r.new}`])))));
}

function download(name, text) {
  const a = el("a", { href: URL.createObjectURL(new Blob([text], { type: "text/markdown" })), download: name });
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

function saveHash() {
  history.replaceState(null, "", `#topic=${encodeURIComponent(state.topic)}&hours=${state.hours}&sort=${state.sort}`);
}

async function selectTopic(id) {
  state.topic = id; state.shown = PAGE;
  saveHash(); renderNav();
  try {
    state.data = await getJSON(`data/${encodeURIComponent(id)}.json`);
    render();
  } catch (e) {
    $("main").replaceChildren(el("p", { class: "empty" }, `データを読み込めませんでした: ${e.message}`));
  }
}

async function init() {
  try {
    state.index = await getJSON("data/index.json");
  } catch (e) {
    $("main").replaceChildren(el("p", { class: "empty" },
      "まだ収集データがありません。GitHub Actions の「Collect X posts」を実行するか、" +
      "ローカルで python collector/collect.py を実行してください。"));
    return;
  }
  const h = new URLSearchParams(location.hash.slice(1));
  if ([0, 24, 72, 168].includes(Number(h.get("hours"))) && h.has("hours")) state.hours = Number(h.get("hours"));
  if (h.get("sort") === "new") state.sort = "new";
  const ids = state.index.topics.map((t) => t.id);
  if (!ids.length) {
    $("main").replaceChildren(el("p", { class: "empty" }, "topics.json にトピックを追加してください。"));
    return;
  }
  await selectTopic(ids.includes(h.get("topic")) ? h.get("topic") : ids[0]);
}
init();
// 開きっぱなしでも新しい収集結果を反映する
setInterval(async () => {
  try {
    const idx = await getJSON("data/index.json");
    if (idx.generated_at !== state.index.generated_at) { state.index = idx; await selectTopic(state.topic); }
  } catch { /* 次回に再試行 */ }
}, 5 * 60 * 1000);
</script>
</body>
</html>
