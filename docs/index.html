<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' https://api.github.com https://api.fxtwitter.com; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<title>トピックレポート</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="bar">
  <a class="brand" href="./">トピックレポート</a>
  <form class="search" id="search" role="search">
    <input type="search" id="q" placeholder="キーワードを検索してタグに追加" aria-label="キーワード検索"
           autocomplete="off" enterkeyhint="search">
  </form>
  <button type="button" class="text-btn" id="btn-settings">設定</button>
</header>
<div class="layout">
  <nav class="sidebar" id="sidebar" aria-label="タグ"></nav>
  <main id="main"><p class="placeholder">読み込み中…</p></main>
</div>
<dialog class="sheet" id="sheet"></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="app.js"></script>
</body>
</html>
